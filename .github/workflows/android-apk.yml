name: build-apk

# Postaví Android aplikaci (obal kolem portálu) a vydá APK ke stažení.
# Spouští se ručně, nebo tagem v* — pak z něj rovnou vznikne release.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Verze zobrazená v telefonu (např. 1.2)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # kvůli vytvoření release u tagu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Odemkni podpisový klíč
        # Bez klíče by se APK podepsalo debug klíčem a doména by ho neuznala,
        # takže by se v aplikaci ukázal adresní řádek. Radši rovnou spadneme.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Chybí secret ANDROID_KEYSTORE_BASE64 — návod je v ANDROID-APP.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"

      - name: Postav podepsané APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Verze: z tagu, ze zadání, jinak číslo běhu. versionCode musí
          # růst, jinak Android odmítne instalaci přes starší verzi.
          NAME="${{ inputs.version_name }}"
          [ -z "$NAME" ] && NAME="${GITHUB_REF_NAME#v}"
          case "$NAME" in refs/*|"") NAME="1.0.${{ github.run_number }}";; esac

          ./gradlew assembleRelease --no-daemon \
            -PstoreFilePath="$RUNNER_TEMP/signing.jks" \
            -PstorePassword="$STORE_PASSWORD" \
            -PkeyAlias="${KEY_ALIAS:-typemaster}" \
            -PkeyPassword="$STORE_PASSWORD" \
            -PtwaVersionCode="${{ github.run_number }}" \
            -PtwaVersionName="$NAME"

          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/typemaster-$NAME.apk"
          echo "APK_PATH=$RUNNER_TEMP/typemaster-$NAME.apk" >> "$GITHUB_ENV"

      - name: Vypiš otisk podpisu
        # Musí sedět s TWA_SHA256_FINGERPRINT na TrueNASu, jinak se v appce
        # objeví adresní řádek. Otisk je veřejný údaj, klidně se loguje.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH" \
            | awk '/SHA-256 digest/ {print toupper($NF)}' \
            | sed 's/../&:/g; s/:$//' \
            | sed 's/^/Otisk podpisu (TWA_SHA256_FINGERPRINT): /'

      - uses: actions/upload-artifact@v4
        with:
          name: typemaster-apk
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Vydej release (jen u tagu)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
