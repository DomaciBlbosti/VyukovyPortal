# TypeMaster na TrueNAS (Docker custom app).
# DŮLEŽITÉ: TrueNAS custom app neumí "build:", proto se používá hotový image.
#   - buď z GHCR (postaví GitHub Actions po pushi) – viz image: níže,
#   - nebo si ho postav lokálně: docker build -t ghcr.io/domaciblbosti/vyukovyportal:latest .
# App si po startu naklonuje kód z Gitu do volume; restart kontejneru = git pull (self-update).
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: typemaster
      MARIADB_USER: typemaster
      MARIADB_PASSWORD: ${DB_PASSWORD:-typemasterVychoziHeslo}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-typemasterVychoziHesloRoot}
    command: ["--innodb-buffer-pool-size=128M"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ${APP_IMAGE:-ghcr.io/domaciblbosti/vyukovyportal:latest}
    # Lokálně postavený image (docker build): never. Pro veřejný GHCR dej "missing".
    pull_policy: ${APP_PULL_POLICY:-never}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: typemaster
      DB_USER: typemaster
      DB_PASSWORD: ${DB_PASSWORD:-typemasterVychoziHeslo}
      # Cesta, pod kterou app běží za reverzní proxy ("" = kořen)
      BASE_URL: ${BASE_URL:-}
      # Otisk podpisu Android aplikace (viz ANDROID-APP.md). Prázdné =
      # /.well-known/assetlinks.json vrátí [] a appka běží s adresním řádkem.
      TWA_SHA256_FINGERPRINT: ${TWA_SHA256_FINGERPRINT:-}
      # Poč. admin účet (založí se jen do prázdné DB)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Self-update z Gitu při startu kontejneru
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      REPO_URL: ${REPO_URL:-https://github.com/DomaciBlbosti/VyukovyPortal.git}
      REPO_BRANCH: ${REPO_BRANCH:-main}
    volumes:
      - app_code:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/index.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db_data:
  app_code:
